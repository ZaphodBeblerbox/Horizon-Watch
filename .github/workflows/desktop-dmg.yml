# Builds the macOS .dmg on GitHub's machines.
#
# WHY NOT LOCALLY. Producing a DMG means compiling the whole Rust app
# from source, which writes several gigabytes of intermediate objects.
# The finished DMG is ~15-30MB; it is the build that needs the room. The
# dev machine is at 100% disk, and its 8.4GB working database is not
# something to delete to make space for a build artefact.
#
# DELIBERATELY MANUAL. macOS runners bill at 10x on a private repo, so
# 2,000 free minutes a month is about 200 macOS minutes — roughly a dozen
# builds. Running this on every push would burn the allowance on commits
# nobody is going to download.
#
# UNSIGNED, ON PURPOSE. There is no Apple Developer account and one is
# not wanted. Recipients will see "Apple could not verify this app is
# free of malware" and must right-click the app and choose Open, or allow
# it once under System Settings > Privacy & Security. The release notes
# say so plainly rather than leaving people to meet it cold.
name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the release tag, e.g. 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  dmg:
    runs-on: macos-14          # Apple silicon
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      # The Rust build is the slow part; caching it is the difference
      # between a 25-minute build and a 5-minute one.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Stamp the version into the bundle
        run: |
          python3 - "$VERSION" <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("src-tauri/tauri.conf.json")
          c = json.loads(p.read_text())
          c["version"] = sys.argv[1]
          p.write_text(json.dumps(c, indent=2) + "\n")
          print("bundle version ->", c["version"])
          PY
        env:
          VERSION: ${{ inputs.version }}

      - name: Build the app and bundle the DMG
        # The Vite bundle includes Cesium and needs more heap than the
        # runner gives Node by default — the first attempt died with
        # "Reached heap limit Allocation failed - JavaScript heap out of
        # memory" inside the frontend build, before Rust was reached at
        # all. It builds locally because this machine's default heap is
        # larger, which is exactly the kind of difference that only shows
        # up in CI.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tauri build --bundles dmg

      - name: Find the DMG
        id: find
        run: |
          DMG=$(find src-tauri/target -name "*.dmg" -print -quit)
          test -n "$DMG" || { echo "no dmg produced"; exit 1; }
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: parallax-dmg
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error

      # Published to the PUBLIC releases repo, not this one. A private
      # repo's release assets need a token to download, so a link to one
      # is useless to the people it is sent to. Source stays private;
      # only the binary is public.
      #
      # RELEASES_TOKEN is a fine-grained PAT with Contents: read & write
      # on ZaphodBeblerbox/parallax-releases and nothing else. The
      # workflow's own GITHUB_TOKEN cannot reach another repository, and
      # a personal CLI token would carry far more scope than a release
      # upload needs.
      - name: Publish a release with the DMG attached
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          REPO=ZaphodBeblerbox/parallax-releases
          # Re-running the same version replaces the asset instead of
          # failing on an already-existing tag.
          # A SECOND COPY UNDER A FIXED NAME. The built DMG carries its
          # version in the filename, so a link to
          # releases/latest/download/Parallax_1.0.0_aarch64.dmg stops
          # resolving the moment 1.0.1 ships — which is exactly what a
          # "always points at the newest build" link must not do. Parallax.dmg
          # is the same bytes under a name that never changes.
          cp "${{ steps.find.outputs.path }}" "$RUNNER_TEMP/Parallax.dmg"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.find.outputs.path }}" \
              "$RUNNER_TEMP/Parallax.dmg" --repo "$REPO" --clobber
            exit 0
          fi
          gh release create "$TAG" "${{ steps.find.outputs.path }}" \
            "$RUNNER_TEMP/Parallax.dmg" \
            --repo "$REPO" \
            --title "Parallax ${{ inputs.version }}" \
            --notes "$(cat <<'NOTES'
          Download the `.dmg`, open it, and drag Parallax to Applications.

          **Then run this once, in Terminal:**

          ```
          xattr -cr /Applications/Parallax.app
          ```

          That clears the quarantine flag macOS puts on anything
          downloaded. The app is not signed with an Apple Developer
          certificate, so without it macOS refuses to open the app and
          says it cannot verify the developer.

          Recent macOS removed the old right-click-and-choose-Open
          shortcut for unsigned apps, so the Terminal command above is the
          reliable way. If you would rather not use Terminal: try to open
          the app, then go to **System Settings > Privacy & Security**,
          scroll down to the message about Parallax and click
          **Open Anyway**.

          You only need to do this once per install.
          NOTES
          )"
