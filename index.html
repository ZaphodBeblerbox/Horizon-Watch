<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Horizon Watch — Trifecta Technologies</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#060d1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horizon" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ── Horizon Watch theme CSS variables ──────────────────────────── */
        :root {
            /* Semantic palette */
            --bg-primary:    #050c1c;
            --bg-secondary:  #080f28;
            --bg-elevated:   #0a1530;
            --bg-glass:      rgba(6,14,45,0.88);
            --border-subtle: rgba(255,255,255,0.08);
            --text-primary:  #f0f4f8;
            --text-secondary:#8899aa;
            --text-muted:    #3d5068;
            --accent:        #1a6eb5;
            --accent-bright: #2d8fe8;
            --accent-glow:   rgba(29,110,181,0.3);
            --severity-critical:    #dc2626;
            --severity-significant: #d97706;
            --severity-elevated:    #1a6eb5;
            --severity-low:         #3d5068;

            /* Legacy --akili-* mapped to new palette */
            --akili-surface:        var(--bg-primary);
            --akili-panel:          var(--bg-glass);
            --akili-panel-blur:     var(--bg-glass);
            --akili-panel-solid:    var(--bg-secondary);
            --akili-surface-raised: var(--bg-elevated);
            --akili-hover:          rgba(255,255,255,0.05);
            --akili-hover-strong:   rgba(255,255,255,0.08);
            --akili-border:         var(--border-subtle);
            --akili-border-subtle:  rgba(255,255,255,0.04);
            --akili-text-primary:   var(--text-primary);
            --akili-text-secondary: var(--text-secondary);
            --akili-text-muted:     var(--text-muted);
            --akili-input-bg:       var(--bg-elevated);
            --akili-input-border:   var(--border-subtle);
            --akili-accent:         var(--accent);
            --akili-accent-bg:      rgba(26,110,181,0.12);
            --akili-accent-border:  rgba(26,110,181,0.35);
            --akili-overlay:        rgba(6,13,26,0.95);
        }
/* ── User location pulse animation ──────────────────────────────── */
        @keyframes akiliUserLocPulse {
            0%, 100% { transform: scale(1);   opacity: 0.25; }
            50%       { transform: scale(1.45); opacity: 0.08; }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/";</script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
