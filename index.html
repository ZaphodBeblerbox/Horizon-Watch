<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Horizon Watch — Trifecta Technologies</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#060d1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horizon" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        /* ── Horizon Watch design tokens ──────────────────────────────────
           Full UI rebuild, exact specification (supersedes Round 1's token
           system entirely — every value below is the literal, mandatory
           value from that spec, not a starting point). No component may
           hardcode a hex/font-size/spacing/radius value outside this file.

           Legacy `--bg-primary`/`--accent`/`--sev-*`/`--akili-*`/`--text-xs..xl`
           names are kept defined (re-pointed at the new real values, not
           their old ones) rather than deleted outright — hundreds of existing
           call sites across the app reference them, and a mechanical
           find-replace across every one of those files in the same pass as
           the token rewrite is exactly the kind of large, error-prone,
           unreviewable change this rebuild is trying to avoid. The literal
           new token names the spec defines (--bg-app, --accent-blue,
           --danger, etc.) are ALL present below with their exact mandated
           values; new/rebuilt components should reference those directly.
           This is a deliberate, documented choice, not an oversight. ────── */
        :root {
            /* ── Surfaces ──────────────────────────────────────────────── */
            --bg-app:      #070B14; /* application canvas behind everything */
            --bg-header:   #0A101C; /* top chrome, 52px tall */
            --bg-header-2: #0C1320; /* secondary toolbar / mode strip */
            --bg-panel:    #0E1624; /* side rails, legends, editor columns */
            --bg-card:     #121C2C; /* map callouts, comment cards, snapshot wells */
            --bg-card-2:   #152033; /* inset cards */
            --bg-input:    #0B1220; /* search fields, selects, slider tracks */
            --border:        #1E2A3D; /* default hairline border */
            --border-strong: #2A3B55; /* active tab underline, focused card border */
            --overlay-map: rgba(7,11,20,0.55); /* legend/scale-bar plates over imagery */

            /* No pure black anywhere, no gradients anywhere, no box-shadow for
               elevation except the one map-callout exception below. */
            --shadow-callout: 0 8px 16px rgba(0,0,0,0.2);

            /* ── Text and signal colors ────────────────────────────────── */
            --text-primary:   #E8EEF7;
            --text-secondary: #8B9BB4;
            --text-muted:     #6B7A90;
            --text-link:      #5BA8FF;
            --accent-blue: #3D8BFF; /* primary buttons, active nav underline, AIS tracks */
            --accent-cyan: #4CC9F0; /* AOI dashed boxes, selected-entity rings */
            --live:   #22C55E; /* LIVE / OPERATIONAL status dots */
            --warn:   #F5A524; /* warnings, medium-confidence, degraded status */
            --danger: #EF4444; /* critical alerts, alert badge count */
            --ai-comment:   #1E3A5F; /* AI Council comment well background */
            --track-purple: #8B7CFF; /* secondary/support tracks */
            --track-green:  #34D399; /* selected-facility connector lines */
            --overlay-blue:   #3D8BFF; /* detection overlay: industrial/generic infra */
            --overlay-green:  #3DDC97; /* detection overlay: port/terminal */
            --overlay-yellow: #E8C547; /* detection overlay: shipyard/construction */
            --overlay-purple: #C084FC; /* detection overlay: power/energy infrastructure */

            /* ── Typography — Inter (UI/prose) + JetBrains Mono (coordinates,
               MMSI/IMO/ICAO/tail numbers, timestamps, report/session IDs,
               confidence scores) — never a third family. ─────────────────── */
            --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            --weight-normal:   400;
            --weight-medium:   500;
            --weight-semibold: 600;
            --weight-bold:     700;
            /* Named role sizes, exactly as spec'd */
            --text-wordmark:       16px; /* Inter SemiBold, +0.4 tracking */
            --text-mode-subtitle:  11px; /* Inter Medium, --text-secondary */
            --text-page-title:     22px; /* Inter SemiBold, line-height 1.2 */
            --text-section-head:   13px; /* Inter SemiBold, paired with circled index */
            --text-body:            13px; /* Inter Regular, line-height 20px, max ~68ch */
            --text-callout-title:  11px; /* Inter SemiBold */
            --text-callout-meta:   10px; /* JetBrains Mono, --text-secondary */
            --text-chip:            10px; /* Inter Medium */
            --text-footer:          10px; /* Inter Regular, --text-muted */
            /* Generic scale — kept for existing call sites (~many files from
               prior rounds reference --text-xs..xl); re-pointed to the
               closest new role size above, not the old values. */
            --text-xs: 10px;
            --text-sm: 11px;
            --text-md: 13px;
            --text-lg: 15px;
            --text-xl: 22px;

            /* ── Spacing — base unit 4px ──────────────────────────────── */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --header-height: 52px;
            --footer-height: 30px; /* 28-32px spec range, midpoint */

            /* ── Radius ────────────────────────────────────────────────── */
            --radius-sm:   6px;  /* controls/buttons */
            --radius-md:   8px;  /* cards/callouts */
            --radius-lg:   10px; /* large panel wells */
            --radius-pill: 999px; /* pills/badges */

            /* ── Elevation — border, not shadow (the one shadow exception
               lives in --shadow-callout above, used only by map callouts). */
            --elevation-1: 1px solid var(--border);
            --elevation-2: 1px solid var(--border-strong);

            /* ── Legacy Round 1 names — re-pointed to the new palette above,
               not deleted, per this block's header note. ─────────────────── */
            --bg-primary:    var(--bg-app);
            --bg-secondary:  var(--bg-panel);
            --bg-elevated:   var(--bg-card);
            --bg-glass:      rgba(7,11,20,0.88);
            --border-subtle: var(--border);
            --border-dim:    rgba(255,255,255,0.05);
            --text-dim:      var(--text-muted);
            --accent:        var(--accent-blue);
            --accent-bright: var(--accent-cyan);
            --accent-faint:  rgba(61,139,255,0.12);
            --accent-border: rgba(61,139,255,0.35);
            --accent-glow:   rgba(61,139,255,0.3);
            --sev-critical: var(--danger);
            --sev-high:     var(--warn);
            --sev-medium:   var(--warn); /* new palette has no 4th stop — collapsed, see PR notes */
            --sev-low:      var(--live);
            --severity-critical:    var(--sev-critical);
            --severity-significant: var(--sev-high);
            --severity-elevated:    var(--sev-medium);
            --severity-low:         var(--sev-low);
            --radius: var(--radius-sm);

            /* Legacy --akili-* aliases — kept resolving, re-pointed at the
               new values above. Hundreds of existing call sites depend on these. */
            --akili-surface:        var(--bg-app);
            --akili-panel:          var(--bg-glass);
            --akili-panel-blur:     var(--bg-glass);
            --akili-panel-solid:    var(--bg-panel);
            --akili-surface-raised: var(--bg-card);
            --akili-hover:          rgba(255,255,255,0.05);
            --akili-hover-strong:   rgba(255,255,255,0.08);
            --akili-border:         var(--border);
            --akili-border-subtle:  rgba(255,255,255,0.04);
            --akili-text-primary:   var(--text-primary);
            --akili-text-secondary: var(--text-secondary);
            --akili-text-muted:     var(--text-muted);
            --akili-input-bg:       var(--bg-input);
            --akili-input-border:   var(--border);
            --akili-accent:         var(--accent-blue);
            --akili-accent-bg:      var(--accent-faint);
            --akili-accent-border:  var(--accent-border);
            --akili-overlay:        rgba(7,11,20,0.95);
        }
/* ── User location pulse animation ──────────────────────────────── */
        @keyframes akiliUserLocPulse {
            0%, 100% { transform: scale(1);   opacity: 0.25; }
            50%       { transform: scale(1.45); opacity: 0.08; }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/";</script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
