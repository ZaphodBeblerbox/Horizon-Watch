<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Parallax — Trifecta Technologies</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#171b20" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horizon" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ── Horizon Watch design tokens — redesign Round 1 ───────────────
           "The corporate risk console spec." Supersedes EVERY prior token
           system entirely: the Inter + JetBrains Mono font tokens, the
           dark-navy/cyan palette, the per-entity-type icon system, and the
           translucent-floating-panel treatment are all gone. This block is
           the literal spec verbatim — no component may hardcode a hex/
           font-size/spacing/radius value outside this file.

           Legacy names (`--bg-app`, `--text-primary`, `--border`, `--accent-
           blue`, `--sev-*`, `--font-sans`, `--radius-*`, `--akili-*`, etc.)
           are kept defined — hundreds of existing call sites across the app
           reference them — but every one is RE-POINTED at the new tokens
           below, not their old values, so the whole app renders in the new
           system immediately without a mechanical find-replace across every
           file (exactly the kind of large, unreviewable change this rebuild
           avoids). Rewiring individual screens to the new component classes
           directly is later-round work; this round is tokens, typography,
           and the component library only. ────────────────────────────── */
        :root {
            /* ── Surfaces — 5 steps, neutral blue-grey, never pure black ── */
            --bg-0: #171b20; /* app background, active tab, log/input wells */
            --bg-1: #1c2127; /* pane background */
            --bg-2: #22282f; /* pane headers, toolbars, cards, top bar */
            --bg-3: #2a3138; /* hover, default button */
            --bg-4: #333b43; /* pressed/selected, button hover, chart tracks */

            /* ── Lines ─────────────────────────────────────────────────── */
            --line:        #30373f;
            --line-soft:   #262c33;
            --line-strong: #3d454e;

            /* ── Text — 4 steps only ──────────────────────────────────── */
            --txt:   #d5dae0;
            --txt-2: #a4adb6;
            --txt-3: #818c96;
            --txt-4: #616b75;

            /* ── Accent — selection and interaction, nothing else ────── */
            --acc:      #3f6fa8;
            --acc-hi:   #5f95d0;
            --acc-dim:  rgba(63,111,168,.22);
            --acc-line: rgba(95,149,208,.42);

            /* ── Semantic ──────────────────────────────────────────────── */
            --red: #c4453c; --amber: #b7822c; --steel: #4f7fa6; --green: #4c7d63; --grey: #77828c;
            --sev-critical: #c4453c; --sev-high: #b7822c; --sev-moderate: #4f7fa6; --sev-low: #6d7883;

            /* ── Derived ───────────────────────────────────────────────── */
            --delta-worse:  #b0645c;
            --delta-better: #6d9a83;
            --tag-red:    #cf6259; --tag-red-border:   #5c3b38;
            --tag-amber:  #c19446; --tag-amber-border: #5a4a2c;
            --tag-green:  #699781; --tag-green-border: #3a5346;
            --tag-blue:   #78a5d4; --tag-blue-border:  #39536e;
            --chart-area-fill:   rgba(63,111,168,.13);
            --chart-area-stroke: #7d97b3;
            --chart-grid:        #262c33;
            --chart-hist:        #4a545e;
            --chart-hist-hot:    #8d5348;
            --heatmap-lo: #232a30; --heatmap-hi: #5c6b78; --heatmap-empty: #1e242a;
            /* Category ramp — greys only, for anything needing distinct
               swatches (domains, sources, regions) that isn't severity. */
            --cat-1: #9aa5ae; --cat-2: #8b96a0; --cat-3: #8d9aa4; --cat-4: #7c8792;
            --cat-5: #7d8993; --cat-6: #6d7883; --cat-7: #6f7b85; --cat-8: #5f6a74;
            --cat-9: #626e78; --cat-10: #515c66; --cat-11: #55616b; --cat-12: #444e58;
            --cat-13: #4a555f; --cat-14: #404b54;

            /* ── Typography — system font stack only, no @font-face, no
               font CDN, anywhere. ────────────────────────────────────── */
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;

            --r: 2px; /* radius everywhere, never more */
            --ease: cubic-bezier(.3,.7,.4,1);
            --shadow: 0 10px 26px rgba(0,0,0,.42), 0 1px 3px rgba(0,0,0,.4); /* tooltip/palette/toast/report-page only */

            --top: 40px;
            --tabs: 32px;
            --status: 24px;

            /* Situation glass panel widths (build spec v2, §3/§4.6/§4.7) —
               the map fit AND every map overlay inset derive from these two
               tokens, so they can never drift apart. */
            --pane-l: 250px;
            --pane-r: 312px;

            /* ══════════════════════════════════════════════════════════
               Legacy Round 1-3 names — kept resolving (hundreds of call
               sites across the app reference these), RE-POINTED at the new
               tokens above rather than their old dark-navy/cyan values.
               New/rebuilt components should reference the real spec names
               above directly, not these. ═══════════════════════════════ */
            --bg-app:      var(--bg-0);
            --bg-header:   var(--bg-2);
            --bg-header-2: var(--bg-2);
            --bg-panel:    var(--bg-1);
            --bg-card:     var(--bg-2);
            --bg-card-2:   var(--bg-3);
            --bg-input:    var(--bg-0);
            --border:        var(--line);
            --border-strong: var(--line-strong);
            --overlay-map: rgba(23,27,32,0.55);

            /* Translucency is gone this round (§1: "every panel... is
               opaque, using one of the five --bg steps") — these legacy
               names are kept resolving for old call sites but now point at
               solid, opaque surfaces, never alpha. */
            --bg-panel-translucent: var(--bg-1);
            --bg-card-translucent:  var(--bg-2);
            --bg-glass:             var(--bg-1);

            --shadow-callout: var(--shadow);

            --text-primary:   var(--txt);
            --text-secondary: var(--txt-2);
            --text-muted:     var(--txt-3);
            --text-dim:       var(--txt-4);
            --text-link:      var(--acc-hi);
            --accent-blue: var(--acc);
            --accent-cyan: var(--acc-hi);
            --live:   var(--green);
            --warn:   var(--amber);
            --danger: var(--red);
            --ai-comment:   var(--bg-3);
            --track-purple: var(--steel);
            --track-green:  var(--green);
            --overlay-blue:   var(--acc);
            --overlay-green:  var(--green);
            --overlay-yellow: var(--amber);
            --overlay-purple: var(--steel);

            --font-sans: var(--font);
            --font-mono: var(--mono);
            --weight-normal:   400;
            --weight-medium:   500;
            --weight-semibold: 600;
            --weight-bold:     600; /* spec's heaviest weight anywhere is 600 — no 700 */

            --text-wordmark:       16px;
            --text-mode-subtitle:  11px;
            --text-page-title:     22px;
            --text-section-head:   12px;
            --text-body:           12.5px;
            --text-callout-title:  11.5px;
            --text-callout-meta:   11px;
            --text-chip:           10px;
            --text-footer:         11px;
            --text-xs: 11px;
            --text-sm: 11.5px;
            --text-md: 12.5px;
            --text-lg: 15px;
            --text-xl: 22px;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --header-height: 52px;
            --footer-height: 30px;

            /* Radius 2px everywhere, never more (§1) — every legacy radius
               name collapses to the one real value. */
            --radius-sm:   var(--r);
            --radius-md:   var(--r);
            --radius-lg:   var(--r);
            --radius-pill: var(--r); /* no pill shapes in this system — see .tag/.chip, both 2px */

            --elevation-1: 1px solid var(--line);
            --elevation-2: 1px solid var(--line-strong);

            --bg-primary:    var(--bg-app);
            --bg-secondary:  var(--bg-panel);
            --bg-elevated:   var(--bg-card);
            --border-subtle: var(--border);
            --border-dim:    var(--line-soft);
            --accent:        var(--accent-blue);
            --accent-bright: var(--accent-cyan);
            --accent-faint:  var(--acc-dim);
            --accent-border: var(--acc-line);
            --accent-glow:   var(--acc-dim);
            --sev-medium:   var(--sev-moderate);
            --severity-critical:    var(--sev-critical);
            --severity-significant: var(--sev-high);
            --severity-elevated:    var(--sev-medium);
            --severity-low:         var(--sev-low);
            --radius: var(--r);

            --akili-surface:        var(--bg-app);
            --akili-panel:          var(--bg-panel);
            --akili-panel-blur:     var(--bg-panel);
            --akili-panel-solid:    var(--bg-panel);
            --akili-surface-raised: var(--bg-card);
            --akili-hover:          var(--bg-3);
            --akili-hover-strong:   var(--bg-4);
            --akili-border:         var(--border);
            --akili-border-subtle:  var(--line-soft);
            --akili-text-primary:   var(--text-primary);
            --akili-text-secondary: var(--text-secondary);
            --akili-text-muted:     var(--text-muted);
            --akili-input-bg:       var(--bg-input);
            --akili-input-border:   var(--border);
            --akili-accent:         var(--accent-blue);
            --akili-accent-bg:      var(--accent-faint);
            --akili-accent-border:  var(--accent-border);
            --akili-overlay:        var(--bg-0);
        }
/* ── User location pulse animation ──────────────────────────────── */
        @keyframes akiliUserLocPulse {
            0%, 100% { transform: scale(1);   opacity: 0.25; }
            50%       { transform: scale(1.45); opacity: 0.08; }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script>window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/";</script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
