    <title>Parallax — Trifecta Technologies</title>
    <script>
        // Parallax theming round — real synchronous no-flash bootstrap.
        // The real theme setting is a per-user, server-persisted DB field
        // (database.py's User.theme, read via /api/auth/me, written via
        // PUT /api/users/me/theme — see src/state/themeStore.js) — NOT a
        // localStorage-only setting. localStorage here is only a paint-time
        // MIRROR of the last-known real value, read synchronously before
        // the app renders so the correct [data-theme] attribute is already
        // on <html> for the very first paint. themeStore.reconcileTheme()
        // corrects this mirror against the real server value once the
        // real session check resolves (app.jsx), which only differs from
        // this cached guess on a new device/browser or right after the
        // user changed it elsewhere.
        (function () {
            try {
                var themeCache = localStorage.getItem("hw-theme-cache")
                if (themeCache === "light") {
                    document.documentElement.setAttribute("data-theme", "light")
                } else if (themeCache !== "dark") {
                    // No mirror at all — a first visit, or cleared storage.
                    // The default mode is Auto, which follows the sun, so the
                    // first paint must not be unconditionally dark: opening a
                    // console in dark mode at midday reads as broken.
                    //
                    // Local clock hour only. This runs before any script has
                    // loaded, so there is no geolocation and no solar maths
                    // available yet — and neither belongs in a blocking paint
                    // bootstrap. It is a coarse guess for ONE frame:
                    // themeStore's real solarElevationDeg() calculation, with
                    // the user's actual coordinates, replaces it as soon as
                    // the app mounts. Being wrong here costs a single frame
                    // near dawn or dusk; being unconditionally dark cost
                    // every daytime first visit.
                    var h = new Date().getHours()
                    if (h >= 7 && h < 19) {
                        document.documentElement.setAttribute("data-theme", "light")
                    }
                }
                // Real Settings round, General section — density is the
                // same real per-user, server-persisted mechanism (see
                // src/state/settingsStore.js), same synchronous paint-time
                // mirror pattern as theme above.
                if (localStorage.getItem("hw-density-cache") === "compact") {
                    document.documentElement.setAttribute("data-density", "compact")
                }
            } catch (e) { /* private mode / storage blocked — falls back to the pre-existing defaults */ }
        })()
    </script>
    <script>
        // Real stale-deploy resilience — the literal last line of defense
        // for the exact reported symptom: a hashed entry bundle
        // (index-<hash>.js) 404ing because this page's own index.html was
        // served stale (via an out-of-date service-worker cache) and still
        // references a build the server no longer has. src/utils/
        // staleChunkRecovery.js (bundled into that SAME entry bundle) is
        // the real, shared implementation of this same guarded-reload
        // logic for every OTHER case (a failed dynamic import inside an
        // already-running app) — but it cannot help THIS specific failure,
        // since if the entry bundle itself never loads, none of that
        // bundled code ever runs either. This one small, dependency-free,
        // inline duplicate (same sessionStorage key, same one-time-reload
        // guard, deliberately kept in sync rather than a second competing
        // policy) is unavoidable: it must survive in a world where the
        // entire rest of this app's JS has failed to load.
        //
        // Real fix (Round 2 stale-registerSW.js investigation): this used
        // to only match a failing /assets/ URL — a stale index.html's own
        // <script src="/registerSW.js"> tag (injectRegister:'auto''s output,
        // served from the site ROOT, not /assets/) failed this check
        // entirely and was silently ignored, even though it's the exact
        // same real "this index.html is stale" signal. Confirmed live via
        // direct reproduction (install the pre-fix service worker, ship the
        // current build, observe the still-open tab's own failed requests).
        (function () {
            var FLAG = "hw-stale-chunk-reload-attempted"
            window.addEventListener("error", function (event) {
                var el = event.target
                if (!el || (el.tagName !== "SCRIPT" && el.tagName !== "LINK")) return
                var src = el.src || el.href || ""
                if (src.indexOf("/assets/") === -1 && src.indexOf("registerSW.js") === -1) return
                var already = false
                try { already = sessionStorage.getItem(FLAG) === "1" } catch (e) { /* private mode */ }
                if (already) {
                    console.error("[stale-chunk] " + src + " failed to load even after clearing caches — this is a broken deploy, not staleness; not retrying again.")
                    return
                }
                try { sessionStorage.setItem(FLAG, "1") } catch (e) { /* private mode — recovery still proceeds */ }
                // A BARE RELOAD CANNOT FIX THIS. If a service worker is
                // serving a precached index.html, the reload is answered
                // by that same worker with that same HTML, referencing
                // the same missing bundle. Production reported exactly
                // that: "failed to load even after a reload". The caches
                // and the worker have to go first.
                console.warn("[stale-chunk] " + src + " failed to load (stale cached shell referencing a superseded deploy) — clearing caches and service workers, then reloading.")
                var jobs = []
                try {
                    if (window.caches) {
                        jobs.push(caches.keys().then(function (keys) {
                            return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                        }))
                    }
                } catch (e) { /* storage blocked */ }
                try {
                    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                            return Promise.all(rs.map(function (r) { return r.unregister() }))
                        }))
                    }
                } catch (e) { /* nothing more to try */ }
                Promise.all(jobs).catch(function () {}).then(function () { window.location.reload() })
            }, true)
        })()
    </script>

    <!-- Leaflet's stylesheet used to be pulled from unpkg here. Nothing in
         this app uses Leaflet — the map is Cesium — so it was a network
         request on every start that could only ever fail offline and buy
         nothing when it succeeded. -->
    <style>
        /* ── Horizon Watch design tokens — redesign Round 1 ───────────────
           "The corporate risk console spec." Supersedes EVERY prior token
           system entirely: the Inter + JetBrains Mono font tokens, the
           dark-navy/cyan palette, the per-entity-type icon system, and the
           translucent-floating-panel treatment are all gone. This block is
           the literal spec verbatim — no component may hardcode a hex/
           font-size/spacing/radius value outside this file.

           Legacy names (`--bg-app`, `--text-primary`, `--border`, `--accent-
           blue`, `--sev-*`, `--font-sans`, `--radius-*`, `--akili-*`, etc.)
           are kept defined — hundreds of existing call sites across the app
           reference them — but every one is RE-POINTED at the new tokens
           below, not their old values, so the whole app renders in the new
           system immediately without a mechanical find-replace across every
           file (exactly the kind of large, unreviewable change this rebuild
           avoids). Rewiring individual screens to the new component classes
           directly is later-round work; this round is tokens, typography,
           and the component library only. ────────────────────────────── */
        :root {
            /* ── Surfaces — 5 steps, neutral blue-grey, never pure black ── */
            --bg-0: #14161f; /* app background, active tab, log/input wells */
            --bg-1: #181b25; /* pane background */
            --bg-2: #1e212c; /* pane headers, toolbars, cards, top bar */
            --bg-3: #252936; /* hover, default button */
            --bg-4: #2f3545; /* pressed/selected, button hover, chart tracks */

            /* ── Lines ─────────────────────────────────────────────────── */
            --line:        #2b3040;
            --line-soft:   #222632;
            --line-strong: #3a4154;

            /* ── Text — 4 steps only ──────────────────────────────────── */
            --txt:   #f2f3f6;
            --txt-2: #dde0e6;
            --txt-3: #b5b9c3;
            --txt-4: #878c9a;

            /* ── Accent — selection and interaction, nothing else ────── */
            --acc:      #3c507d;
            --acc-hi:   #a0b2d2;
            --acc-dim:  rgba(60,80,125,.22);
            --acc-line: rgba(160,178,210,.42);

            /* ── Semantic ──────────────────────────────────────────────── */
            --red: #f46043; --amber: #e0a94e; --steel: #7c93c4; --green: #7fc4a0; --grey: #878c9a;
            --sev-critical: #f46043; --sev-high: #f5d98f; --sev-moderate: #8fb0e8; --sev-low: #80858f;

            /* ── Derived ───────────────────────────────────────────────── */
            --delta-worse:  #e07a62;
            --delta-better: #7fc4a0;
            --tag-red:    #f17a60; --tag-red-border:   #6b3b31;
            --tag-amber:  #dcb068; --tag-amber-border: #5e4a28;
            --tag-green:  #8ecbab; --tag-green-border: #37544a;
            --tag-blue:   #a0b2d2; --tag-blue-border:  #39476a;
            --chart-area-fill:   rgba(60,80,125,.13);
            --chart-area-stroke: #8fa6c6;
            --chart-grid:        #222632;
            --chart-hist:        #4a5165;
            --chart-hist-hot:    #9a5a48;
            /* Sequential, one hue, light->dark — the same blue the share bars
               use, so magnitude reads the same way everywhere on the page.
               `empty` is the panel ground: a cell with no data should read as
               absence, not as the smallest real value. */
            --heatmap-lo: #222a3d; --heatmap-hi: #8fb0dc; --heatmap-empty: #181b25;
            /* Share-of-window bars. One hue, not a category ramp: domain /
               region / source breakdowns name every row in text, so colour
               carries magnitude, not identity. The old 14-step grey ramp is
               gone — it coloured categories by a hash of their name, so a
               90% class and an 8% class could land two hex points apart. */
            --chart-bar:     #8fa6c6; /* share-of-window bars (3.0:1 on --bg-1) */
            --chart-bar-track: #222632;

            /* ── Real glass-pane tokens (Parallax theming pass) — the
               previously-untokenized rgba() literals .pane-glass and
               .akili-glass used directly (designSystem.css / index.css).
               Real dark-theme tint kept as the previous literal values;
               a real, distinct light-theme tint is defined below (never
               the dark theme's translucent black reused — see index.css). */
            --pane-glass-bg:     var(--glass); /* v6 A2: panes are GLASS. This was
                                      deliberately flattened to a solid
                                      #181b25 at some point; the whole
                                      v6 look is translucency over the
                                      map, so it goes back. */
            --akili-glass-bg:    #14161f;   /* solid: matches --bg-0 */
            --akili-glass-border: rgba(242,243,246,0.07);

            /* ── Real map-overlay tooltip tokens (Parallax theming pass) —
               previously-untokenized literals in index.css's Leaflet
               tooltip overrides (.shipping-tooltip-inner/.country-tooltip/
               .eez-tooltip/.vessel-popup/etc). Kept as their own real,
               named per-type accents (vessel/EEZ/etc. are deliberately
               different real hues today, not consolidated into one — a
               real, separate design decision from this pass's scope) —
               just tokenized so they're themeable, not decorative/hardcoded. */
            --map-tooltip-bg:      #1e212c; /* solid: matches --bg-2 (floating card over the map) */
            --map-tooltip-text:    #dde0e6;
            --map-tooltip-text-strong: #f2f3f6;
            --map-tooltip-border:  rgba(242,243,246,0.12);
            --map-vessel-accent:   #38bdf8;
            --map-vessel-border:   rgba(172,176,187,0.35);
            --map-country-border:  rgba(172,176,187,0.3);
            --map-eez-border:      rgba(125,130,146,0.35);
            --map-infra-bg:        #1e212c;
            --map-infra-border:    #2b3040;
            --map-infra-text:      #b5b9c3;
            --map-infra-text-hover: #f2f3f6;
            --map-detection-label-bg: rgba(0,0,0,0.75);
            --map-detection-label-text: #f2f3f6;
            --leaflet-bg:          #14161f;
            --scrollbar-thumb:       rgba(242,243,246,0.12);
            --scrollbar-thumb-hover: rgba(242,243,246,0.2);
            --focus-ring: rgba(99,105,124,0.6);

            /* ── Real component-specific tokens (Parallax theming pass) —
               previously-untokenized literals in designSystem.css's
               .btn.primary/.btn.danger/.check/.xref/.tooltip rules. */
            --btn-primary-border: #4b6195;
            --btn-primary-text:   #f2f3f6;
            --btn-primary-hover:  #46588a;
            --check-mark-color:   #f2f3f6;
            --xref-color:       #a0b2d2;
            --xref-hover-color: #c5d4ee;
            --xref-hover-bg:    rgba(60,80,125,.16);
            --xref-active-bg:   rgba(60,80,125,.28);
            --xref-active-color: #ebf6ff;
            --tooltip-bg: #1e212c;
            --scrim-bg: rgba(0,0,0,.5);
            --sheet-shadow-color: rgba(0,0,0,.4);

            /* ── Typography — system font stack only, no @font-face, no
               font CDN, anywhere. ────────────────────────────────────── */
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;

            --r: 2px; /* radius everywhere, never more */
            --ease: cubic-bezier(.3,.7,.4,1);
            --shadow: 0 10px 26px rgba(0,0,0,.42), 0 1px 3px rgba(0,0,0,.4); /* tooltip/palette/toast/report-page only */

            --top: 40px;
            --tabs: 32px;
            /* 0 because the status bar was removed. Kept as a token, not
               deleted, because every docked panel and map overlay is
               positioned against it — and a token that still exists can be
               given a height again without hunting down its consumers. */
            --status: 0px;
            /* Collapsed, the bar keeps only its grip — see the rule below. */

            /* Situation glass panel widths (build spec v2, §3/§4.6/§4.7) —
               the map fit AND every map overlay inset derive from these two
               tokens, so they can never drift apart. */
            --pane-l: 250px;
            --pane-r: 312px;

            /* Tells the UA which scheme the app is painting, so native
               form controls, scrollbars and the canvas behind the page
               match the theme instead of defaulting to light. The theme
               itself stays an explicit per-user choice — this declares the
               result, it does not infer it from the OS. */
            color-scheme: dark;
            /* Radius is 2px everywhere: a 2px corner reads as a machined
               edge, an 8px corner reads as a consumer app. --r-lg exists
               so "large" surfaces cannot quietly reintroduce rounding. */
            --r-lg: 2px;

            /* ── Generated theme tokens (PARALLAX spec §2) ──────────────
               Every literal colour that used to sit inline in a rule is
               one of these, so both themes can restate it. Named by their
               dark-theme hex purely so the generator's output is
               traceable — the light block below redefines each one to a
               real warm-paper equivalent, never a naive inversion.
               Track glyphs, tooltips and the archive chart reference
               these directly; without them those rules resolve to
               nothing and the glyph silently disappears. */
            --t7fadde:#8fb0dc;--t3a4249:#3a4154;--t48525b:#495064;--t4c7d63:var(--green);--t4a7cb5:var(--btn-primary-border);--tf2f6fa:var(--btn-primary-text);
            --t487cba:var(--btn-primary-hover);--tcf6259:var(--tag-red);--t3a2c2b:#2a2f3e;--t5c3b38:var(--tag-red-border);--teef3f8:var(--check-mark-color);--tc19446:var(--tag-amber);
            --t5a4a2c:var(--tag-amber-border);--t699781:var(--tag-green);--t3a5346:var(--tag-green-border);--t78a5d4:var(--tag-blue);--t39536e:var(--tag-blue-border);--t12161a:#13151f;
            --t232a30:#252936;--t2e363d:#2f3446;--t2a3138:var(--bg-3);--t333a3c:#32384a;--t39424a:#3a4054;--t20262b:#212531;
            --t262d33:#272c3a;--te8edf2:#eaecf0;--tb9c2ca:#bcc0c9;--t8d4a44:#8a4038;--t20262c:var(--tooltip-bg);--t4a545e:var(--chart-hist);
            --t8d5348:var(--chart-hist-hot);--tb0645c:var(--delta-worse);--t6d9a83:var(--delta-better);--t111417:#10131f;--t1b1f24:#1b1e29;--t33383f:#313749;
            --t22272d:#222632;--t5f6772:#5e6578;--t5a6270:#5a6175;--tb7822c:var(--amber);--tc8a04a:#c89a45;--t171b20:var(--bg-0);
            --tdcc48c:#ddc28e;--t5f95d0:var(--acc-hi);--t8ebdf0:#a8c4e8;--t7fa8c9:#8fa6c6;--tc4453c:var(--red);--ta8b6c2:#afb3be;
            --t5f7b91:#5a6e8f;--t7b8792:#7f8493;--t8d99a4:#9196a3;--t242b31:#262a37;--t2f373e:#303547;--tc2cbd3:#c5c9d1;
            --t4c5762:#4e5569;--t4d5964:#50576b;--t7b8894:#808594;--t262c33:var(--line-soft);--t616b75:var(--txt-4);--t7f8b96:#848997;
            --t232a31:#252936;--t3d454e:var(--line-strong);--t2b333b:#2d3142;--td5dae0:var(--txt);--t0f1317:#0e121f;--t4f7fa6:var(--steel);
            --t82aede:var(--xref-color);--ta8c8ee:var(--xref-hover-color);--tcfe0f4:var(--xref-active-color);--t0d1013:#0b0f1f;--t818c96:var(--txt-3);--ta4adb6:var(--txt-2);
            --t3a4048:#383f52;--t30373f:var(--line);--t1c2127:var(--bg-1);--t7c8792:#7f8493;--t9aa5ae:#9da1ae;
            --tr0:rgba(24,27,37,.72);
            --tr1:rgba(30,33,44,.8);--tr2:rgba(58,65,84,.7);--tr3:rgba(244,96,67,.07);--tr4:rgba(24,27,37,.9);--tr5:rgba(20,22,31,.6);--tr6:rgba(30,33,44,.94);
            --tr7:rgba(10,14,31,.9);--tr8:rgba(0,0,0,.5);--tr9:rgba(10,14,31,.6);--tr10:rgba(30,33,44,.72);--tr11:rgba(30,33,44,.6);--tr12:rgba(30,33,44,.55);
            --tr13:rgba(20,22,31,.66);--tr14:rgba(224,169,78,.10);--tr15:rgba(20,22,31,.9);--tr16:rgba(160,178,210,.10);--tr17:rgba(20,22,31,.82);--tr18:rgba(30,33,44,.85);
            --tr19:rgba(244,96,67,.12);--tr20:rgba(242,243,246,.5);--tr21:rgba(160,178,210,.5);--tr22:rgba(60,80,125,.16);--tr23:rgba(60,80,125,.28);--tr24:rgba(60,80,125,.20);
            --tr25:rgba(60,80,125,.34);--tr26:rgba(244,96,67,.14);--tr27:rgba(244,96,67,.16);--tr28:rgba(60,80,125,.12);--tr29:rgba(60,80,125,.07);--tr30:rgba(160,178,210,.06);
            --tr31:rgba(224,169,78,.12);

            /* Tooltips are frosted, never opaque: on a map the thing under
               the cursor is the thing being asked about, and an opaque card
               answers the question by hiding the subject. */
            --tip-bg:#1e212c;
            --tip-line:rgba(198,202,210,.20);

            /* Declared at :root deliberately. Scoped to .panes it is
               invisible to position:fixed elements — which is exactly how a
               critical notification card ends up parked on the archive
               controls. Raised by the html:has() rules below. */
            --strip-h:0px;

            /* ══════════════════════════════════════════════════════════
               Legacy Round 1-3 names — kept resolving (hundreds of call
               sites across the app reference these), RE-POINTED at the new
               tokens above rather than their old dark-navy/cyan values.
               New/rebuilt components should reference the real spec names
               above directly, not these. ═══════════════════════════════ */
            --bg-app:      var(--bg-0);
            --bg-header:   var(--bg-2);
            --bg-header-2: var(--bg-2);
            --bg-panel:    var(--bg-1);
            --bg-card:     var(--bg-2);
            --bg-card-2:   var(--bg-3);
            --bg-input:    var(--bg-0);
            --border:        var(--line);
            --border-strong: var(--line-strong);
            --overlay-map: rgba(20,22,31,0.55);

            /* Translucency is gone this round (§1: "every panel... is
               opaque, using one of the five --bg steps") — these legacy
               names are kept resolving for old call sites but now point at
               solid, opaque surfaces, never alpha. */
            --bg-panel-translucent: var(--bg-1);
            --bg-card-translucent:  var(--bg-2);
            --bg-glass:             var(--bg-1);

            --shadow-callout: var(--shadow);

            --text-primary:   var(--txt);
            --text-secondary: var(--txt-2);
            --text-muted:     var(--txt-3);
            --text-dim:       var(--txt-4);
            --text-link:      var(--acc-hi);
            --accent-blue: var(--acc);
            --accent-cyan: var(--acc-hi);
            --live:   var(--green);
            --warn:   var(--amber);
            --danger: var(--red);
            --ai-comment:   var(--bg-3);
            --track-purple: var(--steel);
            --track-green:  var(--green);
            --overlay-blue:   var(--acc);
            --overlay-green:  var(--green);
            --overlay-yellow: var(--amber);
            --overlay-purple: var(--steel);

            --font-sans: var(--font);
            --font-mono: var(--mono);
            --weight-normal:   400;
            --weight-medium:   500;
            --weight-semibold: 600;
            --weight-bold:     600; /* spec's heaviest weight anywhere is 600 — no 700 */

            --text-wordmark:       16px;
            --text-mode-subtitle:  11px;
            --text-page-title:     22px;
            --text-section-head:   12px;
            --text-body:           12.5px;
            --text-callout-title:  11.5px;
            --text-callout-meta:   11px;
            --text-chip:           10px;
            --text-footer:         11px;
            --text-xs: 11px;
            --text-sm: 11.5px;
            --text-md: 12.5px;
            --text-lg: 15px;
            --text-xl: 22px;

            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --header-height: 52px;
            --footer-height: 30px;

            /* Radius 2px everywhere, never more (§1) — every legacy radius
               name collapses to the one real value. */
            --radius-sm:   var(--r);
            --radius-md:   var(--r);
            --radius-lg:   var(--r);
            --radius-pill: var(--r); /* no pill shapes in this system — see .tag/.chip, both 2px */

            --elevation-1: 1px solid var(--line);
            --elevation-2: 1px solid var(--line-strong);

            --bg-primary:    var(--bg-app);
            --bg-secondary:  var(--bg-panel);
            --bg-elevated:   var(--bg-card);
            --border-subtle: var(--border);
            --border-dim:    var(--line-soft);
            --accent:        var(--accent-blue);
            --accent-bright: var(--accent-cyan);
            --accent-faint:  var(--acc-dim);
            --accent-border: var(--acc-line);
            --accent-glow:   var(--acc-dim);
            --sev-medium:   var(--sev-moderate);
            --severity-critical:    var(--sev-critical);

           Real light theme (Parallax translation — dark/light theming
           pass). A genuine second value set for every real BASE token
           above — deliberately NOT a CSS filter/invert (that destroys
           imagery and reverses severity hues: a red-critical marker
           inverting into something reading as safe). Legacy alias names
           are NOT repeated here — they're defined once, above, as
           `var(--base-token)` references, so they inherit the light
           values automatically the moment the base token changes; only
           the ~40 real non-aliased base tokens need a real light value.

           set synchronously by the bootstrap script below (before first
           paint, from a real per-user server-persisted setting — never
           localStorage-only, never a useEffect that runs after paint).
           No attribute = dark (today's only real theme, zero regression
           for existing users); prefers-color-scheme is intentionally NOT
           consulted here — theme is a real explicit per-user choice, not
           inferred from the OS.

           Real, reversed-lightness-curve mapping (never a flat linear
           inversion, which collapses mid-tones into each other): surfaces
           go lightest(bg-0, base)->less-light(bg-4, most elevated/pressed)
           on a warm paper ramp, NEVER pure white (#fff glares on a dense
           console and hairline borders vanish into it); text goes
           darkest(txt, most prominent)->lighter(txt-4, most muted) ink;
           amber-family hues (sev-high/tag-amber) get real extra chroma
           (darkened + saturated, not just naively inverted) to stay
           legible on paper, which a plain invert would wash out.

           (#f5f0e6): txt 14.7:1, txt-2 9.2:1, txt-3 5.2:1 — all real

            /* Values are the build manual's §03 light block verbatim. The

               lightness: --bg-0 is the map void and is the DARKEST paper,
               --bg-2 is a header/card and is the LIGHTEST. This ordering
               was previously inverted here, which made panel headers read
               darker than the ground they sit on — the opposite of the
               dark theme's relationship. Contrast verified against all
               three grounds: body text 4.58-14.39:1, semantics 4.62+,

        /* ── --strip-h raise rules (PARALLAX spec §2) ──────────────────────
           The time strip is 98px in its density face and 176px once the
           archive/timeline face is showing. Fixed-position overlays (the
           notification stack, toasts) subtract this so they clear the strip
           instead of landing on top of its controls — a constant offset rots
           the moment the strip changes height.

           These were written against #view-map.active, which NO ELEMENT IN
           THIS APP EVER CARRIED — so --strip-h stayed 0 and every consumer
           quietly behaved as though there were no strip at all: the
           notification stack and toasts sat on the strip's controls, and the
           Layers/Inspector panes ran the full height of the view straight
           over it. That is the exact failure the note here predicted, found
           the moment §11's strip became a real element. Keyed off #timestrip
           and #gcstrip, which do exist. */
        html:has(#timestrip) { --strip-h: 76px; }
        html:has(#gcstrip:not(.hidden)) { --strip-h: 150px; }
        /* Collapsed wins over both, including the archive face — otherwise
           collapsing while the timeline is showing leaves 150px of gap
           where the chart used to be. */
        html:has(#timestrip.collapsed) { --strip-h: 30px; }

        /* ── --pane-bottom: ONE statement of "clear the strip" ─────────────
           Five files had each grown their own copy of
           calc(max(var(--strip-h,0px),30px) + 24px). Five copies of a
           geometry fact is five chances for one of them to be stale, which
           is exactly how the Imagery sidebar ended up running under the
           timeline while the Layers pane beside it cleared it correctly.

           It is keyed off the strip's EXISTENCE, not floored with max(), so
           a screen that has no strip does not reserve 54px for a strip that
           is not there. Where a strip does exist, --strip-h already reports
           which face is showing (density 76 / archive 150 / collapsed 30),
           so this tracks a resize instead of guessing at one. +24 clears the
           strip's own bottom:12 inset and leaves a 12px gap above it. */
        :root { --pane-bottom: 22px; }
        html:has(#timestrip) { --pane-bottom: calc(var(--strip-h) + 24px); }
        /* The status bar collapses to a grip. Keyed off the element so
           every consumer of --status (docked panels, the notification
           stack, the map chrome) reclaims the space rather than floating
           above a gap. */
        /* The status bar itself was removed; this rule is kept only so a
           future bar can collapse the same way the time strip does. It
           matches nothing today. */
        html:has(#statusbar.collapsed) { --status: 14px; }

        /* ── Real Settings round, General section: density ─────────────────
           A genuine second value set on the exact spacing tokens the whole
           app already reads (--space-1..4, --top) — same architecture as
           [data-theme]: an explicit [data-density] attribute on <html>,
           applied by the same synchronous no-flash bootstrap script that
           applies theme, never inferred/guessed. No attribute = today's
           existing "comfortable" spacing, zero regression for every
           current user. Every existing var(--space-N)/var(--top) call site
           in the app picks this up automatically — no per-component change
           needed, exactly like a theme switch. */
        :root[data-density="compact"] {
            --space-1: 3px;
            --space-2: 6px;
            --space-3: 9px;
            --space-4: 12px;
            --top: 34px;
        }

/* The 75s linear transition across ~85 colour tokens that used to live here
   is deliberately gone (PARALLAX spec §4.1). Interpolating the palette means
   passing through mid-grey text on a mid-grey ground — contrast collapses to
   roughly 1:1 at the midpoint, in every colour space — so an automatic turn
   spent over a minute unreadable. The palette is now binary and turns at
   solar elevation 0°; what animates is the veil below. */
#sky-veil {
    position: fixed; inset: 0; z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity .15s linear;
}
#sky-veil.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #sky-veil { display: none; } }

/* ── User location pulse animation ──────────────────────────────── */
        @keyframes akiliUserLocPulse {
            0%, 100% { transform: scale(1);   opacity: 0.25; }
            50%       { transform: scale(1.45); opacity: 0.08; }
        }
    </style>
    <!-- ══════════════════════════════════════════════════════════════════
         PARALLAX v6 · Part G theme tokens, verbatim.

         THE WHOLE LOOK IS TRANSLUCENCY. Every floating surface in v6 is
         glass: background var(--glass), backdrop-filter blur(22px)
         saturate(1.15), a 1px var(--gline) border and var(--gshadow). Our
         panels were opaque blocks, which is why the app read as a stack of
         cards instead of instruments laid over a map. These tokens come
         first because they change every surface at once; the geometry
         (Part A2) and the element specs (Part B) build on them.

         The legacy bridge at the bottom re-points this codebase's older
         token names at the v6 ones, so a component written months ago
         becomes glass without being touched.
         ══════════════════════════════════════════════════════════════════ -->
    <style id="plx6-tokens">
        :root, :root[data-theme="dark"] {
            --canvas:#14161f; --sea:#181b25; --land:#252936;
            --landline:rgba(181,185,195,.16); --grat:rgba(221,224,230,.05);
            --glass:rgba(30,33,44,.52); --glass2:rgba(52,56,70,.28);
            --bar:rgba(24,27,37,.9); --solid:#1e212c;
            --gline:rgba(242,243,246,.09); --gline2:rgba(242,243,246,.17);
            --gshadow:0 14px 36px rgba(10,14,31,.45),0 1px 2px rgba(10,14,31,.35);
            --txt:#f2f3f6; --txt2:#dde0e6; --txt3:#b5b9c3; --txt4:#878c9a;
            --acc:#3c507d; --acchi:#a0b2d2; --acchov:#3a5281;
            --accdim:rgba(160,178,210,.13);
            --red:#f46043; --amber:oklch(0.78 0.13 72); --steel:#878c9a; --green:#a0b2d2;
            --hov:rgba(242,243,246,.05); --scrim:rgba(10,14,31,.3);
        }
        :root[data-theme="light"] {
            --canvas:#f3f2ee; --sea:#fafaf7; --land:#e9e8e3;
            --landline:#d4d3cc; --grat:rgba(39,42,56,.05);
            --glass:rgba(252,251,246,.56); --glass2:rgba(236,235,230,.35);
            --bar:rgba(252,251,246,.9); --solid:#fcfbf6;
            --gline:rgba(39,42,56,.10); --gline2:rgba(39,42,56,.19);
            --gshadow:0 8px 28px rgba(26,29,44,.08),0 2px 6px rgba(26,29,44,.05);
            --txt:#1a1d2c; --txt2:#3e4250; --txt3:#5c616f; --txt4:#6a6f7d;
            --acc:#272a38; --acchi:#3c507d; --acchov:#1a1d2c;
            --accdim:rgba(39,42,56,.08);
            --red:#d4492e; --amber:oklch(0.64 0.13 66); --steel:#5c616f; --green:#3c507d;
            --hov:rgba(39,42,56,.05); --scrim:rgba(39,42,56,.05);
        }

        /* Muzzo family aliases. The spec names three voices; we bind them
           to the families this build actually ships so a component copied
           from Part B renders instead of falling back to Times. */
        :root {
            --mz-font-body: var(--font);
            --mz-font-display: var(--font);
            --mz-font-edit: Georgia, 'Times New Roman', serif;
            --mz-font-mono: var(--mono);
            --mz-cream:#fcfbf6; --mz-navy:#01164d; --mz-klein:#0724a1;
            --mz-sky:#ebf6ff; --mz-orange:#f46043; --mz-rule:rgba(1,22,77,.18);
            --mz-ink-40:#5c616f; --mz-ink-55:#3e4250; --mz-ink-60:#50545f;
            --mz-paper-04:#fcfbf6; --mz-sapphire:#3c507d; --mz-navy-400:#5a719c;
            --mz-shadow-lg:0 8px 28px rgba(1,22,77,.10),0 2px 6px rgba(1,22,77,.06);
            --mz-ease:cubic-bezier(.22,.61,.36,1);
        }

        /* ── Legacy bridge ──────────────────────────────────────────────
           Older components name surfaces --bg-0..--bg-4 and lines
           --line*. Re-pointing them here is what turns the existing app
           translucent without editing 40 files. --bg-2 in particular was
           the opaque chrome fill; it is now the glass bar. */
        :root {
            --bg-0: var(--canvas);
            --bg-1: var(--sea);
            --bg-2: var(--bar);
            --bg-3: var(--hov);
            --bg-4: var(--accdim);
            --line: var(--gline);
            --line-soft: var(--gline);
            --line-strong: var(--gline2);
            --txt-2: var(--txt2);
            --txt-3: var(--txt3);
            --txt-4: var(--txt4);
            --acc-hi: var(--acchi);
            --acc-hover: var(--acchov);
        }

        /* Translucency only reads as glass when what is behind it is
           blurred; without this a semi-transparent panel is just murky.
           22px/1.15 are the spec's numbers. */
        .plx-glass,
        .pane, .panel, .card, .bar, .dlg, .sheet, .popover, .menu,
        [data-glass] {
            backdrop-filter: blur(22px) saturate(1.15);
            -webkit-backdrop-filter: blur(22px) saturate(1.15);
        }

        /* Map UI is rounded (A11): pills and 10–22px radii. Everything
           else keeps square corners. */

        /* Part A9.1 / Part G — the two accent strokes of the X mark, and
           the pulse that wraps it. Used only as loading indicators. */
        @keyframes plx-e1{0%,15%{opacity:0;transform:translate(-3px,4.4px)}40%,75%{opacity:1;transform:none}100%{opacity:0;transform:none}}
        @keyframes plx-e2{0%,35%{opacity:0;transform:translate(-3px,4.4px)}60%,75%{opacity:1;transform:none}100%{opacity:0;transform:none}}
        @keyframes plx-pulse{0%,100%{opacity:.35}50%{opacity:1}}
        @keyframes plx-fade{to{opacity:0;visibility:hidden}}
        .plx-pill { border-radius: 999px; }
    </style>
</head>

<body>
    <div id="root"></div>
    <!-- CESIUM'S OWN ASSETS, FROM THIS BUILD, NOT FROM A CDN.
         This pointed at cesium.com, which meant the globe could not start
         without a network: Cesium fetches its Workers, Assets and Widgets
         from CESIUM_BASE_URL at init, and offline every one of them failed,
         so the desktop build opened to an empty scene. The whole 22 MB
         build is already bundled at /cesium (public/cesium symlinks
         node_modules/cesium/Build/Cesium and Vite copies it into dist), so
         this was fetching from the internet what was already on disk.
         Relative, not absolute: the DMG serves from tauri://localhost. -->
    <script>window.CESIUM_BASE_URL = "./cesium/";</script>
    <script type="module" src="/src/main.jsx"></script>
</body>
