<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Horizon Watch — Trifecta Technologies</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ── Horizon Watch theme CSS variables ──────────────────────────── */
        :root {
            /* Semantic palette */
            --bg-primary:    #060d1a;
            --bg-secondary:  #0a1628;
            --bg-elevated:   #0f1e35;
            --bg-glass:      rgba(10,22,40,0.88);
            --border-subtle: rgba(255,255,255,0.08);
            --text-primary:  #f0f4f8;
            --text-secondary:#8899aa;
            --text-muted:    #3d5068;
            --accent:        #1a6eb5;
            --accent-bright: #2d8fe8;
            --accent-glow:   rgba(29,110,181,0.3);
            --severity-critical:    #dc2626;
            --severity-significant: #d97706;
            --severity-elevated:    #1a6eb5;
            --severity-low:         #3d5068;

            /* Legacy --akili-* mapped to new palette */
            --akili-surface:        var(--bg-primary);
            --akili-panel:          var(--bg-glass);
            --akili-panel-blur:     var(--bg-glass);
            --akili-panel-solid:    var(--bg-secondary);
            --akili-surface-raised: var(--bg-elevated);
            --akili-hover:          rgba(255,255,255,0.05);
            --akili-hover-strong:   rgba(255,255,255,0.08);
            --akili-border:         var(--border-subtle);
            --akili-border-subtle:  rgba(255,255,255,0.04);
            --akili-text-primary:   var(--text-primary);
            --akili-text-secondary: var(--text-secondary);
            --akili-text-muted:     var(--text-muted);
            --akili-input-bg:       var(--bg-elevated);
            --akili-input-border:   var(--border-subtle);
            --akili-accent:         var(--accent);
            --akili-accent-bg:      rgba(26,110,181,0.12);
            --akili-accent-border:  rgba(26,110,181,0.35);
            --akili-overlay:        rgba(6,13,26,0.95);
        }
        [data-theme="day"] {
            /* Day mode semantic palette */
            --bg-primary:    #f0f4f8;
            --bg-secondary:  #e2e8f0;
            --bg-elevated:   #ffffff;
            --bg-glass:      rgba(240,244,248,0.92);
            --border-subtle: rgba(0,0,0,0.09);
            --text-primary:  #0a1628;
            --text-secondary:#2d4a6b;
            --text-muted:    #8899aa;
            --accent:        #1a6eb5;
            --accent-bright: #1558a0;
            --accent-glow:   rgba(29,110,181,0.15);
            --severity-critical:    #dc2626;
            --severity-significant: #d97706;
            --severity-elevated:    #1a6eb5;
            --severity-low:         #8899aa;

            /* Day mode legacy overrides */
            --akili-hover:          rgba(0,0,0,0.04);
            --akili-hover-strong:   rgba(0,0,0,0.07);
            --akili-border-subtle:  rgba(0,0,0,0.04);
            --akili-overlay:        rgba(240,244,248,0.97);
        }
        /* ── User location pulse animation ──────────────────────────────── */
        @keyframes akiliUserLocPulse {
            0%, 100% { transform: scale(1);   opacity: 0.25; }
            50%       { transform: scale(1.45); opacity: 0.08; }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
