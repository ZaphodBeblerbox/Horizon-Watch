<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke-width="2.6" stroke-linecap="butt">
  <!-- Echo X (v4.3 §1). Adapts to the OS scheme: a favicon is drawn on
       the browser's chrome, not on ours, so it cannot follow the app's
       own theme token. The X sits 1 unit left so the mark reads centred
       once the echoes are counted as part of it. -->
  <style>
    .ink  { stroke: #26231e; }
    .echo { stroke: #2f5c90; }
    @media (prefers-color-scheme: dark) {
      .ink  { stroke: #d5dae0; }
      .echo { stroke: #5f95d0; }
    }
  </style>
  <path class="ink"  d="M3 4L14 20M14 4L3 20"/>
  <path class="echo" d="M18 4L12.5 12M22 4L19.25 8"/>
</svg>
