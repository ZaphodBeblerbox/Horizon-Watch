# MediaMTX config for Horizon Watch drone streaming
# Start with: mediamtx mediamtx.yml

logLevel: info
logDestinations: [stdout]

# RTMP ingest — DJI streams here
rtmpAddress: :1935

# HLS output — FastAPI proxy at /api/drone/hls/* handles cookie-check server-side
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsAlwaysRemux: yes

# API for path status checks
api: yes
apiAddress: :9997

paths:
  all:
    source: publisher
